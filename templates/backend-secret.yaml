{{- if .Values.backend.env }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.backend.name }}-env
  labels:
    app: {{ .Values.backend.name }}
    {{- include "myapp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.backend.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}

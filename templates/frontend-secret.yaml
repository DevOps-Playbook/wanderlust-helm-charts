{{- if .Values.frontend.env }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.frontend.name }}-env
  labels:
    app: {{ .Values.frontend.name }}
    {{- include "myapp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.frontend.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
